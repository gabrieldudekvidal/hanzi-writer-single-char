<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hanzi Writer Single Char</title>

        <style>
            #target {
                width: 200px;
                height: 200px;
                border: 2px solid #cc0000;
                position: relative;
                background:
                    linear-gradient(
                        to bottom,
                        transparent 49.5%,
                        #cc0000 49.5%,
                        #cc0000 50.5%,
                        transparent 50.5%
                    ),
                    linear-gradient(
                        to right,
                        transparent 49.5%,
                        #cc0000 49.5%,
                        #cc0000 50.5%,
                        transparent 50.5%
                    );
                background-color: #fff;
            }
        </style>
    </head>
    <body>
        <div id="target"></div>
        <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.2.1/dist/hanzi-writer.min.js"></script>
        <script>
            const params = new URLSearchParams(window.location.search);
            const char = (params.get("char") || "人")[0];

            const writer = HanziWriter.create("target", char, {
                width: 200,
                height: 200,
                showOutline: true,
            });

            const play = () =>
                writer.animateCharacter({
                    onComplete: () => setTimeout(play, 1500),
                });
            play();
        </script>
    </body>
</html>
